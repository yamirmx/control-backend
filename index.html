<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Financiero Pro - MultiUsuario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
            secondary: '#10B981',
            darkBg: '#0F172A',
            darkCard: '#1E293B'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200 min-h-screen">

  <!-- ==============================
       PANTALLA DE AUTENTICACIÓN
       ============================== -->
  <div id="auth-screen" class="flex min-h-screen items-center justify-center px-4 py-12 sm:px-6 lg:px-8 bg-gray-100">
    <div class="w-full max-w-md space-y-8 bg-white p-8 rounded-2xl shadow-xl transition-all border border-gray-100">
      <div class="text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-indigo-100 text-indigo-600 text-2xl">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <h2 id="auth-title" class="mt-6 text-3xl font-extrabold tracking-tight text-gray-900">
          Iniciar Sesión
        </h2>
        <p id="auth-subtitle" class="mt-2 text-sm text-gray-600">
          ¿No tienes una cuenta? 
          <a href="#" onclick="toggleAuthMode(true)" class="font-medium text-indigo-600 hover:text-indigo-500">Regístrate gratis</a>
        </p>
      </div>

      <form class="mt-8 space-y-6" onsubmit="handleAuth(event)">
        <div class="space-y-4 rounded-md shadow-sm">
          <div>
            <label for="email-address" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
            <input id="email-address" name="email" type="email" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="tu@correo.com">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
            <input id="password" name="password" type="password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="••••••••">
          </div>
        </div>

        <div id="auth-error" class="hidden text-red-500 text-sm font-medium bg-red-50 p-3 rounded-lg border border-red-200 text-center"></div>

        <div>
          <button type="submit" id="auth-btn" class="group relative flex w-full justify-center rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all">
            Ingresar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==============================
       PANTALLA DE DASHBOARD (APP PRINCIPAL)
       ============================== -->
  <div id="app-screen" class="hidden">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 py-4 px-6 flex justify-between items-center shadow-sm">
      <div class="flex items-center gap-3">
        <span class="text-2xl text-indigo-600"><i class="fa-solid fa-wallet"></i></span>
        <h1 class="text-xl font-bold tracking-tight">Control Financiero <span class="text-indigo-600">Pro</span></h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="user-display" class="text-sm font-medium text-gray-600 hidden sm:inline"></span>
        <button onclick="handleLogout()" class="px-4 py-2 text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition-all">
          <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Cerrar Sesión
        </button>
      </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
      
      <!-- Resumen General -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Balance General -->
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">Balance Total</p>
            <h3 id="balance-total" class="text-3xl font-extrabold text-indigo-600 mt-1">$0.00</h3>
          </div>
          <div class="p-3 bg-indigo-50 text-indigo-600 rounded-2xl text-xl"><i class="fa-solid fa-scale-balanced"></i></div>
        </div>

        <!-- Ingresos -->
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">Ingresos Totales</p>
            <h3 id="ingresos-total" class="text-3xl font-extrabold text-emerald-600 mt-1">$0.00</h3>
          </div>
          <div class="p-3 bg-emerald-50 text-emerald-600 rounded-2xl text-xl"><i class="fa-solid fa-circle-arrow-up"></i></div>
        </div>

        <!-- Gastos -->
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">Gastos Totales</p>
            <h3 id="gastos-total" class="text-3xl font-extrabold text-rose-600 mt-1">$0.00</h3>
          </div>
          <div class="p-3 bg-rose-50 text-rose-600 rounded-2xl text-xl"><i class="fa-solid fa-circle-arrow-down"></i></div>
        </div>
      </div>

      <!-- Sección de Cuentas y Nueva Cuenta -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Cuentas -->
        <div class="lg:col-span-1 space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
            <h3 class="text-lg font-bold mb-4 flex justify-between items-center">
              Mis Cuentas
              <button onclick="toggleModal('modal-cuenta', true)" class="text-indigo-600 hover:text-indigo-500 text-sm font-semibold">
                <i class="fa-solid fa-plus mr-1"></i> Nueva
              </button>
            </h3>
            <div id="cuentas-list" class="space-y-3">
              <!-- Cuentas renderizadas dinámicamente -->
              <p class="text-sm text-gray-400 text-center py-4">No tienes cuentas registradas.</p>
            </div>
          </div>
        </div>

        <!-- Historial y Registro -->
        <div class="lg:col-span-2 space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
            <div class="flex justify-between items-center mb-6">
              <h3 class="text-lg font-bold">Historial de Movimientos</h3>
              <button id="add-trans-btn" disabled onclick="toggleModal('modal-transaccion', true)" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                <i class="fa-solid fa-plus mr-2"></i>Registrar Movimiento
              </button>
            </div>
            
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-gray-200 text-xs font-semibold uppercase text-gray-400">
                    <th class="py-3 px-4">Concepto</th>
                    <th class="py-3 px-4">Cuenta</th>
                    <th class="py-3 px-4">Monto</th>
                    <th class="py-3 px-4 text-right">Acción</th>
                  </tr>
                </thead>
                <tbody id="transacciones-list" class="divide-y divide-gray-100">
                  <!-- Transacciones cargadas dinámicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- ==============================
       MODALES
       ============================== -->

  <!-- Modal Nueva Cuenta -->
  <div id="modal-cuenta" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl border border-gray-100">
      <h3 class="text-xl font-bold mb-4">Nueva Cuenta</h3>
      <form onsubmit="createCuenta(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Nombre de la cuenta</label>
            <input id="cuenta-nombre" type="text" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ejem: Tarjeta, Efectivo">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Saldo Inicial (Opcional)</label>
            <input id="cuenta-monto" type="number" step="0.01" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500" placeholder="0.00">
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" onclick="toggleModal('modal-cuenta', false)" class="px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 rounded-xl">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl">Crear Cuenta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Nueva Transacción -->
  <div id="modal-transaccion" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl border border-gray-100">
      <h3 class="text-xl font-bold mb-4">Registrar Movimiento</h3>
      <form onsubmit="createTransaccion(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Cuenta</label>
            <select id="trans-cuentaId" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 bg-white">
              <!-- Opciones cargadas por JS -->
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Tipo de movimiento</label>
            <div class="grid grid-cols-2 gap-3 mt-1">
              <label class="flex items-center justify-center gap-2 border border-gray-300 rounded-xl p-3 cursor-pointer hover:bg-emerald-50 hover:border-emerald-500 transition-all select-none">
                <input type="radio" name="tipo" value="ingreso" checked class="text-emerald-600 focus:ring-emerald-500">
                <span class="text-sm font-medium text-emerald-600">Ingreso</span>
              </label>
              <label class="flex items-center justify-center gap-2 border border-gray-300 rounded-xl p-3 cursor-pointer hover:bg-rose-50 hover:border-rose-500 transition-all select-none">
                <input type="radio" name="tipo" value="gasto" class="text-rose-600 focus:ring-rose-500">
                <span class="text-sm font-medium text-rose-600">Gasto</span>
              </label>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Monto</label>
            <input id="trans-monto" type="number" step="0.01" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500" placeholder="0.00">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Concepto</label>
            <input id="trans-concepto" type="text" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500" placeholder="Ejem: Súper, Pago de nómina">
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" onclick="toggleModal('modal-transaccion', false)" class="px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 rounded-xl">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==============================
       SISTEMA DE LOGICA CON JS
       ============================== -->
  <script>
    // URL de tu Backend
    const API = "https://control-backend-ndpz.onrender.com";

    let token = localStorage.getItem('token') || '';
    let isRegisterMode = false;
    let cuentas = [];

    // Inicializar App
    window.onload = () => {
      checkSession();
    };

    function checkSession() {
      if (token) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-display').innerText = localStorage.getItem('userEmail') || 'Mi Cuenta';
        fetchData();
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    }

    function toggleAuthMode(register) {
      isRegisterMode = register;
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      const btn = document.getElementById('auth-btn');
      const errorDiv = document.getElementById('auth-error');
      
      errorDiv.classList.add('hidden');

      if (register) {
        title.innerText = "Crear Cuenta Nueva";
        subtitle.innerHTML = '¿Ya tienes cuenta? <a href="#" onclick="toggleAuthMode(false)" class="font-medium text-indigo-600 hover:text-indigo-500">Inicia sesión</a>';
        btn.innerText = "Registrarme";
      } else {
        title.innerText = "Iniciar Sesión";
        subtitle.innerHTML = '¿No tienes una cuenta? <a href="#" onclick="toggleAuthMode(true)" class="font-medium text-indigo-600 hover:text-indigo-500">Regístrate gratis</a>';
        btn.innerText = "Ingresar";
      }
    }

    async function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('email-address').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('auth-error');
      const btn = document.getElementById('auth-btn');

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = "Procesando...";

      const endpoint = isRegisterMode ? '/api/auth/signup' : '/api/auth/login';

      try {
        const response = await fetch(`${API}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Ocurrió un error inesperado');
        }

        // Guardar sesión
        token = data.token;
        localStorage.setItem('token', token);
        localStorage.setItem('userEmail', data.user.email);

        checkSession();
      } catch (error) {
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = isRegisterMode ? "Registrarme" : "Ingresar";
      }
    }

    function handleLogout() {
      token = '';
      localStorage.clear();
      checkSession();
    }

    // --- MANEJO DE DATOS DEL DASHBOARD ---

    async function fetchData() {
      try {
        const response = await fetch(`${API}/api/cuentas`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error();

        cuentas = await response.json();
        renderDashboard();
      } catch (error) {
        console.error("Error al cargar datos", error);
        // Si el token expira o es incorrecto por algún cambio, forzar logout
        handleLogout();
      }
    }

    function renderDashboard() {
      const balanceTotalEl = document.getElementById('balance-total');
      const ingresosTotalEl = document.getElementById('ingresos-total');
      const gastosTotalEl = document.getElementById('gastos-total');
      const cuentasListEl = document.getElementById('cuentas-list');
      const transaccionesListEl = document.getElementById('transacciones-list');
      const addTransBtn = document.getElementById('add-trans-btn');
      const selectCuentas = document.getElementById('trans-cuentaId');

      let balance = 0;
      let ingresos = 0;
      let gastos = 0;
      let allTransactions = [];

      // Limpiar select de cuentas del modal transacciones
      selectCuentas.innerHTML = "";

      if (cuentas.length === 0) {
        cuentasListEl.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">No tienes cuentas. Crea una para comenzar.</p>`;
        addTransBtn.disabled = true;
      } else {
        addTransBtn.disabled = false;
        cuentasListEl.innerHTML = "";
        
        cuentas.forEach(cuenta => {
          balance += cuenta.monto;

          // Añadir opción al selector del modal
          const option = document.createElement('option');
          option.value = cuenta.id;
          option.innerText = cuenta.nombre;
          selectCuentas.appendChild(option);

          // Construir lista de cuentas en UI
          cuentasListEl.innerHTML += `
            <div class="flex justify-between items-center p-3 rounded-xl hover:bg-gray-50 border border-gray-100 transition-all">
              <span class="font-medium text-sm text-gray-700">${cuenta.nombre}</span>
              <span class="font-bold text-sm ${cuenta.monto >= 0 ? 'text-emerald-600' : 'text-rose-600'}">
                $${cuenta.monto.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
              </span>
            </div>
          `;

          // Recolectar transacciones
          cuenta.transacciones.forEach(t => {
            if (t.tipo === 'ingreso') ingresos += t.monto;
            if (t.tipo === 'gasto') gastos += t.monto;
            allTransactions.push({ ...t, cuentaNombre: cuenta.nombre });
          });
        });
      }

      // Renderizar números globales
      balanceTotalEl.innerText = `$${balance.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      ingresosTotalEl.innerText = `$${ingresos.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      gastosTotalEl.innerText = `$${gastos.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      // Ordenar todas las transacciones por fecha desc
      allTransactions.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      // Renderizar transacciones en tabla
      if (allTransactions.length === 0) {
        transaccionesListEl.innerHTML = `
          <tr>
            <td colspan="4" class="py-8 text-center text-sm text-gray-400">No hay movimientos registrados en tus cuentas.</td>
          </tr>
        `;
      } else {
        transaccionesListEl.innerHTML = "";
        allTransactions.forEach(t => {
          transaccionesListEl.innerHTML += `
            <tr class="hover:bg-gray-50 transition-all">
              <td class="py-4 px-4 text-sm font-semibold">${t.concepto}</td>
              <td class="py-4 px-4 text-xs text-gray-500 font-medium">
                <span class="bg-gray-100 px-2 py-1 rounded-lg">${t.cuentaNombre}</span>
              </td>
              <td class="py-4 px-4 text-sm font-bold ${t.tipo === 'ingreso' ? 'text-emerald-600' : 'text-rose-600'}">
                ${t.tipo === 'ingreso' ? '+' : '-'}$${t.monto.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
              </td>
              <td class="py-4 px-4 text-right">
                <button onclick="deleteTransaccion(${t.id})" class="text-rose-600 hover:text-rose-800 p-2 text-sm"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `;
        });
      }
    }

    // --- OPERACIONES ---

    async function createCuenta(e) {
      e.preventDefault();
      const nombre = document.getElementById('cuenta-nombre').value;
      const monto = document.getElementById('cuenta-monto').value;

      try {
        const response = await fetch(`${API}/api/cuentas`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ nombre, monto })
        });

        if (!response.ok) throw new Error('Error al crear la cuenta');

        toggleModal('modal-cuenta', false);
        document.getElementById('cuenta-nombre').value = "";
        document.getElementById('cuenta-monto').value = "";
        fetchData();
      } catch (error) {
        alert(error.message);
      }
    }

    async function createTransaccion(e) {
      e.preventDefault();
      const cuentaId = document.getElementById('trans-cuentaId').value;
      const tipo = document.querySelector('input[name="tipo"]:checked').value;
      const monto = document.getElementById('trans-monto').value;
      const concepto = document.getElementById('trans-concepto').value;

      try {
        const response = await fetch(`${API}/api/transacciones`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ cuentaId, tipo, monto, concepto })
        });

        if (!response.ok) throw new Error('Error al registrar movimiento');

        toggleModal('modal-transaccion', false);
        document.getElementById('trans-monto').value = "";
        document.getElementById('trans-concepto').value = "";
        fetchData();
      } catch (error) {
        alert(error.message);
      }
    }

    async function deleteTransaccion(id) {
      if (!confirm('¿Seguro que deseas eliminar este movimiento? El saldo de la cuenta se ajustará automáticamente.')) return;

      try {
        const response = await fetch(`${API}/api/transacciones/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Error al eliminar');

        fetchData();
      } catch (error) {
        alert(error.message);
      }
    }

    // --- VENTANAS MODALES ---
    function toggleModal(id, show) {
      const modal = document.getElementById(id);
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }
  </script>
</body>
</html>
